name: Live connector contracts

on:
  schedule:
    - cron: "17 3 * * 2,5"
  workflow_dispatch:

concurrency:
  group: live-connectors
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          APP_VERBATIM_LIVE_TESTS: "1"
