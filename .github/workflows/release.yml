name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build package artifact
        id: pack
        shell: bash
        run: |
          PACKAGE_FILE=$(npm pack --silent)
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE_FILE" > "$PACKAGE_FILE.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: gh release create "${GITHUB_REF_NAME}" "$PACKAGE_FILE" "$PACKAGE_FILE.sha256" --generate-notes --verify-tag
