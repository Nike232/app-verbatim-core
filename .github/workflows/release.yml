name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build package artifact
        id: pack
        shell: bash
        run: |
          PACKAGE_FILE=$(npm pack --silent)
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE_FILE" > "$PACKAGE_FILE.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: gh release create "${GITHUB_REF_NAME}" "$PACKAGE_FILE" "$PACKAGE_FILE.sha256" --generate-notes --verify-tag
      - name: Advance moving v0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v0" -f sha="${GITHUB_SHA}" >/dev/null
          fi
