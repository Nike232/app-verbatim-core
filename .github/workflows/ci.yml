name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  dependency_review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  action_smoke:
    name: action-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: regression
        uses: ./
        with:
          demo: true
          fail-on-regression: false
      - name: Verify Action outputs
        env:
          STATUS: ${{ steps.regression.outputs.status }}
          VIOLATIONS: ${{ steps.regression.outputs.violations }}
        run: |
          test "$STATUS" = "fail"
          test "$VIOLATIONS" -ge 4

  required:
    if: always()
    needs: [verify, dependency_review, security, action_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EVENT_NAME: ${{ github.event_name }}
      VERIFY_RESULT: ${{ needs.verify.result }}
      DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      ACTION_SMOKE_RESULT: ${{ needs.action_smoke.result }}
    steps:
      - name: Require every applicable quality check
        shell: bash
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$ACTION_SMOKE_RESULT" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$DEPENDENCY_REVIEW_RESULT" = "success"
          else
            test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
          fi
