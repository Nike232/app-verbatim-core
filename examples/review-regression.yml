name: App review regression

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read
  issues: write

jobs:
  review-health:
    runs-on: ubuntu-latest
    steps:
      - uses: Nike232/app-verbatim-core@v0
        with:
          app-url: https://play.google.com/store/apps/details?id=YOUR.APP.ID
          country: US
          language: en
          create-issue: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
