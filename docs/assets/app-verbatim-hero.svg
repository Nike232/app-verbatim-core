<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <!--
    Design philosophy:
    Intent: make a release regression feel as concrete and urgent as a failed test, with the quiet confidence of an engineering instrument.
    Signature: a warm editorial canvas collides with one dense, near-black CI evidence console and a single vermilion breach line.
    Constraint: no glossy gradients, mascot art, decorative icon grid, or claims that the product cannot prove.
    DESIGN_VARIANCE 6/10 · MOTION_INTENSITY 1/10 · VISUAL_DENSITY 7/10
  -->
  <title id="title">App Verbatim turns app reviews into a release quality gate</title>
  <desc id="desc">A release regression console comparing two versions, showing a rating drop, low-rating spike, source review evidence, and a failed CI exit.</desc>
  <defs>
    <pattern id="paper-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#d7d2c6" stroke-width="1" opacity=".62"/>
    </pattern>
    <filter id="console-shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#49443a" flood-opacity=".22"/>
    </filter>
    <clipPath id="console-clip"><rect x="512" y="52" width="716" height="536" rx="18"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="#f3f0e8"/>
  <rect width="1280" height="640" fill="url(#paper-grid)"/>
  <path d="M0 0H22V640H0Z" fill="#e85b2a"/>

  <g fill="#171915">
    <text x="70" y="92" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3.4">APP VERBATIM / RELEASE INTELLIGENCE</text>
    <text x="70" y="176" font-family="Georgia, Times New Roman, serif" font-size="54" font-weight="700" letter-spacing="-1.9">
      <tspan x="70" dy="0">Your users</tspan>
      <tspan x="70" dy="60">wrote the release</tspan>
      <tspan x="70" dy="60">regression test.</tspan>
    </text>
    <text x="70" y="410" font-family="Trebuchet MS, Segoe UI, sans-serif" font-size="21" fill="#4d5049">
      <tspan x="70" dy="0">Turn App Store + Google Play reviews</tspan>
      <tspan x="70" dy="31">into a failing CI check—with evidence.</tspan>
    </text>
  </g>

  <g font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing=".8">
    <rect x="70" y="494" width="132" height="34" rx="17" fill="#171915"/><text x="88" y="516" fill="#f3f0e8">GITHUB ACTION</text>
    <rect x="212" y="494" width="60" height="34" rx="17" fill="#e4dfd2" stroke="#bdb6a6"/><text x="229" y="516" fill="#171915">CLI</text>
    <rect x="282" y="494" width="67" height="34" rx="17" fill="#e4dfd2" stroke="#bdb6a6"/><text x="299" y="516" fill="#171915">MCP</text>
    <text x="70" y="574" fill="#77786f" font-size="12" letter-spacing="2.1">NO AI KEY · SOURCE EVIDENCE · EXIT CODE 1</text>
  </g>

  <g filter="url(#console-shadow)">
    <rect x="512" y="52" width="716" height="536" rx="18" fill="#171a17" stroke="#393d37" stroke-width="2"/>
  </g>
  <g clip-path="url(#console-clip)">
    <rect x="512" y="52" width="716" height="54" fill="#20241f"/>
    <circle cx="544" cy="79" r="6" fill="#e85b2a"/>
    <circle cx="566" cy="79" r="6" fill="#c8a744"/>
    <circle cx="588" cy="79" r="6" fill="#5d9a70"/>
    <text x="620" y="85" fill="#aeb6aa" font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="13">review-regression / ubuntu-latest</text>

    <g font-family="Cascadia Code, SFMono-Regular, Consolas, monospace">
      <text x="548" y="144" fill="#78c58e" font-size="15">$</text>
      <text x="570" y="144" fill="#eef1e9" font-size="15">app-verbatim check --demo</text>

      <text x="548" y="190" fill="#8e978a" font-size="12" letter-spacing="1.5">RELEASE HEALTH / PULSE NOTES</text>
      <text x="548" y="227" fill="#eef1e9" font-size="22" font-weight="700">4.8.0</text>
      <text x="625" y="227" fill="#747c71" font-size="14">vs</text>
      <text x="656" y="227" fill="#c4cbc0" font-size="18">4.7.2</text>

      <line x1="548" y1="258" x2="1192" y2="258" stroke="#343a33"/>
      <text x="548" y="295" fill="#aeb6aa" font-size="13">AVERAGE RATING</text>
      <text x="742" y="297" fill="#eef1e9" font-size="24" font-weight="700">1.97</text>
      <text x="829" y="295" fill="#6f786d" font-size="13">from 3.31</text>
      <rect x="1044" y="274" width="120" height="34" rx="4" fill="#4b251d" stroke="#a5482b"/>
      <text x="1064" y="296" fill="#ff9a74" font-size="13" font-weight="700">−1.34  FAIL</text>

      <text x="548" y="347" fill="#aeb6aa" font-size="13">LOW RATINGS</text>
      <text x="742" y="349" fill="#eef1e9" font-size="24" font-weight="700">72%</text>
      <text x="829" y="347" fill="#6f786d" font-size="13">from 28%</text>
      <rect x="1044" y="326" width="120" height="34" rx="4" fill="#4b251d" stroke="#a5482b"/>
      <text x="1064" y="348" fill="#ff9a74" font-size="13" font-weight="700">+44pp  FAIL</text>

      <line x1="548" y1="386" x2="1192" y2="386" stroke="#343a33"/>
      <text x="548" y="422" fill="#ff9a74" font-size="15" font-weight="700">✕  New complaint fingerprint: camera uploads</text>
      <text x="548" y="454" fill="#aeb6aa" font-size="13">3 reviews in 4.8.0 · 0 in 4.7.2 · 8% share</text>

      <path d="M558 523 L620 511 L682 518 L744 488 L806 500 L868 472 L930 480 L992 447 L1054 427 L1116 391 L1178 372" fill="none" stroke="#e85b2a" stroke-width="3"/>
      <path d="M558 523 L620 511 L682 518 L744 488 L806 500 L868 472 L930 480 L992 447 L1054 427 L1116 391 L1178 372 L1178 548 L558 548 Z" fill="#e85b2a" opacity=".08"/>
      <line x1="548" y1="548" x2="1192" y2="548" stroke="#343a33"/>
      <text x="548" y="572" fill="#ff9a74" font-size="14" font-weight="700">Process completed with exit code 1</text>
      <text x="1143" y="572" fill="#78c58e" font-size="12">evidence ↗</text>
    </g>
  </g>
</svg>
